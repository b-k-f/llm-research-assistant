name: Run the research agent

# Run it from the Actions tab: "Run the research agent" -> "Run workflow"
on:
  workflow_dispatch:
    inputs:
      question:
        description: "Your research question"
        required: true
        default: "How does Self-RAG decide when to retrieve, and how does that differ from standard RAG?"
      max_steps:
        description: "Maximum number of agent steps"
        required: true
        default: "8"

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-120b' }}
      QUESTION: ${{ inputs.question }}
      MAX_STEPS: ${{ inputs.max_steps }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU-only PyTorch keeps the install fast)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Run the agent
        shell: bash
        run: |
          research-assistant agent "$QUESTION" --max-steps "$MAX_STEPS"
          cat results/agent_trace.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-trace
          path: results/
