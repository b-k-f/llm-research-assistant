name: Evaluate retrieval

# Run it from the Actions tab: "Evaluate retrieval" -> "Run workflow"
on:
  workflow_dispatch:
    inputs:
      chunk_sizes:
        description: "Chunk sizes to compare (comma-separated)"
        required: true
        default: "500,1000,1500"
      methods:
        description: "Retrieval methods: vector, hybrid, hybrid+rerank"
        required: true
        default: "vector,hybrid,hybrid+rerank"
      judge:
        description: "Also grade answers with an LLM judge (uses API calls)"
        type: boolean
        default: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-120b' }}
      CHUNK_SIZES: ${{ inputs.chunk_sizes }}
      METHODS: ${{ inputs.methods }}
      JUDGE: ${{ inputs.judge }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU-only PyTorch keeps the install fast)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Run evaluation
        shell: bash
        run: |
          args=(--chunk-sizes "$CHUNK_SIZES" --methods "$METHODS")
          if [ "$JUDGE" = "true" ]; then args+=(--judge); fi
          research-assistant evaluate "${args[@]}"
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: results/
